// Buff mode shortcuts. Copy this file to:
//   <SteamDir>\steamapps\common\dota 2 beta\game\dota\cfg\autoexec.cfg
// If you already have an autoexec.cfg there, add the lines below to it instead.
// Restart Dota 2 afterwards, then type one of these in the console during the pick phase.
alias OMG80  "sv_cheats 1; script_reload_code bots/Buff/mode/omg80"
alias OMG    "sv_cheats 1; script_reload_code bots/Buff/mode/omg"
alias Normal "sv_cheats 1; script_reload_code bots/Buff/mode/normal"
alias Random "sv_cheats 1; script_reload_code bots/Buff/mode/random"

bind "kp_1" "sv_cheats 1; script_reload_code bots/Buff/mode/omg80"
bind "kp_2" "sv_cheats 1; script_reload_code bots/Buff/mode/omg"
bind "kp_3" "sv_cheats 1; script_reload_code bots/Buff/mode/normal"